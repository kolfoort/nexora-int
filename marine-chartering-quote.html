<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Request a vessel charter quotation from Nexora International.">
<title>Marine Chartering Quote — NEXORA</title>
<style>
:root{--navy:#06254a;--gold:#d9a92d;--ink:#414141;--muted:#737373;--line:#bcbcbc;--paper:#fff;--soft:#f5f6f7}
*{box-sizing:border-box}html{min-height:100%;background:var(--paper)}body{margin:0;color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:16px}
a{color:inherit;text-decoration:none}.header{height:102px;padding:0 clamp(22px,4.2vw,54px);display:flex;align-items:center;background:#fff}.logo{width:225px;height:auto;display:block}
main{width:min(100% - 40px,772px);margin:38px auto 74px}.heading{text-align:center;margin-bottom:48px}.heading h1{margin:0;color:#3f3f3f;font-size:25px;line-height:1.2;font-weight:900;letter-spacing:.035em}.heading:after{content:"";display:block;width:180px;height:4px;background:var(--navy);margin:17px auto 0}.heading p{margin:32px 0 0;font-size:20px;line-height:1.5;letter-spacing:.01em}
form{display:grid;gap:21px}.field{display:flex;flex-direction:column;gap:7px}.field label,.legend{font-size:18px;letter-spacing:.01em}.required{font-weight:700}.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:0;background:#fff;color:#333;font:inherit;min-height:43px;padding:9px 11px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy);box-shadow:0 0 0 2px rgba(6,37,74,.12)}.field select{width:min(100%,440px);min-height:40px;background:var(--soft)}.field textarea{min-height:132px;resize:vertical}.field input::placeholder,.field textarea::placeholder{color:#999}
.choice-list{display:grid;gap:5px;margin-top:1px}.choice{display:flex;align-items:center;gap:7px;font-size:17px;line-height:1.2}.choice input{width:15px;height:15px;margin:0;accent-color:var(--navy)}.send{margin-top:8px;min-height:48px;border:0;background:#9d9d9d;color:white;font-size:17px;letter-spacing:.04em;cursor:pointer;transition:background .15s ease}.send:hover,.send:focus-visible{background:var(--navy)}.note{margin:0;color:var(--muted);font-size:13px;line-height:1.5;text-align:center}.back{display:inline-block;margin-top:25px;color:var(--navy);font-size:13px;font-weight:800;letter-spacing:.08em}
@media(max-width:600px){.header{height:78px}.logo{width:185px}main{width:min(100% - 36px,772px);margin:32px auto 52px}.heading{margin-bottom:34px}.heading p{font-size:17px;margin-top:24px}.field label,.legend{font-size:16px}form{gap:18px}}
</style>
</head>
<body>
<header class="header"><a href="index.html" aria-label="NEXORA — return to homepage"><img class="logo" src="nexora-logo.jpg" alt="NEXORA"></a></header>
<main>
  <div class="heading"><h1>MARINE CHARTERING</h1><p>Tell us about your vessel and cargo requirements. Our team will be in touch within hours.</p></div>
  <form id="quote-form">
    <div class="field"><label for="name">Name <span class="required">*</span></label><input id="name" name="Name" autocomplete="name" required></div>
    <div class="field"><label for="company">Company <span class="required">*</span></label><input id="company" name="Company" autocomplete="organization" required></div>
    <div class="field"><label for="email">E-mail <span class="required">*</span></label><input id="email" name="E-mail" type="email" autocomplete="email" required></div>
    <div class="field"><label for="phone">Phone Number <span class="required">*</span></label><input id="phone" name="Phone Number" type="tel" autocomplete="tel" required></div>
    <div class="field"><label for="vessel">Vessel Type <span class="required">*</span></label><select id="vessel" name="Vessel Type" required><option value="">--</option><option>ULCC</option><option>VLCC</option><option>OBO</option><option>Suezmax</option><option>Aframax</option><option>LNG | LPG</option><option>Chemical | Product Tanker</option><option>MR Tanker</option><option>Oil Tanker</option></select></div>
    <div class="field"><label for="quantity">Requested Quantity <span class="required">*</span></label><input id="quantity" name="Requested Quantity" inputmode="decimal" required></div>
    <div class="field"><label for="unit">Unit <span class="required">*</span></label><select id="unit" name="Unit" required><option value="">--</option><option>BBL</option><option>MT</option></select></div>
    <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="legend">Delivery Terms <span class="required">*</span></legend><div class="choice-list"><label class="choice"><input type="radio" name="Delivery Terms" value="FOB" required> FOB</label><label class="choice"><input type="radio" name="Delivery Terms" value="CFR" required> CFR</label></div></fieldset>
    <div class="field"><label for="loading-port">Port of Loading</label><input id="loading-port" name="Port of Loading" autocomplete="off"></div>
    <div class="field"><label for="discharge-port">Port of Discharge</label><input id="discharge-port" name="Port of Discharge" autocomplete="off"></div>
    <div class="field"><label for="information">MORE INFORMATION</label><textarea id="information" name="More Information"></textarea></div>
    <button class="send" type="submit">SEND</button>
    <p class="note">Submitting opens an e-mail addressed to NEXORA with your request details.</p>
  </form>
  <a class="back" href="index.html#marine-chartering">← BACK TO MARINE CHARTERING</a>
</main>
<script>
const form=document.getElementById('quote-form');
const vessel=document.getElementById('vessel');
const requestedVessel=new URLSearchParams(window.location.search).get('vessel');
if(requestedVessel){
  const option=[...vessel.options].find(item=>item.value.toLowerCase()===requestedVessel.replaceAll('+',' ').toLowerCase()||item.text.toLowerCase()===requestedVessel.replaceAll('+',' ').toLowerCase());
  if(option) vessel.value=option.value;
}
form.addEventListener('submit',event=>{
  event.preventDefault();
  if(!form.reportValidity()) return;
  const data=new FormData(form);
  const body=[...data.entries()].map(([key,value])=>`${key}: ${value}`).join('\n');
  const subject=`Marine chartering request — ${vessel.value}`;
  window.location.href=`mailto:info@nexora-int.eu?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
});
</script>
</body>
</html>
